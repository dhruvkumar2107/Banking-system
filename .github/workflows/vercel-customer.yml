name: Deploy Customer to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          
      - name: Build
        working-directory: apps/customer
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=https://banking-system-zhtb.onrender.com/api
          
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: apps/customer/build/web