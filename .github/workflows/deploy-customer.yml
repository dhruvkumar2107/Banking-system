name: Deploy Customer App (Flutter → Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'apps/customer/**'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CUSTOMER }}

jobs:
  deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Flutter web
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release --pwa-strategy=none \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Deploy to Vercel (production)
        run: vercel --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
