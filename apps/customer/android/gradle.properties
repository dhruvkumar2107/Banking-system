org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Must stay true. AGP 9 compiles Kotlin itself, and file_picker 11 relies on it:
# its build.gradle applies the Kotlin Gradle Plugin ONLY when AGP is 8 or older,
# on the assumption that AGP 9 takes over. With this flag false, nothing compiles
# its Kotlin sources — the module still builds, but publishes a classes.jar
# holding only R.class, and the app then fails `compileReleaseJavaWithJavac` with
# "cannot find symbol: class FilePickerPlugin" from GeneratedPluginRegistrant.
android.builtInKotlin=true
